<meta property="og:description" content="Remember when you met people at parties? 

Date My Friend (DMF) is the singles party where you bring a friend, single or taken, to be your wingperson, hype squad, and built-in exit strategy. There are no pitch decks and no name tags. Singles get a green wristband, so nobody has to ask, &quot;So… are you here for the thing?&quot;

This time, DMF enters its Millennial Era: a night for singles in their 30s and 40s who remember the sound of dial-up and still know their AIM screen name by heart.

We&#x27;re taking over ROGER at The Ameswell Hotel, an indoor-outdoor spot right off 101 with an Airstream bar, cornhole on the lawn, and plenty of space to mix and mingle. Grab a cocktail or a mocktail and see where the night goes.

How it works
- Singles, bring a friend (single or taken). Their job is to make it fun and maybe make an introduction.
- Look for green. A green wristband means single.
- Meet new people and expect the classics: weekend plans, what you do for fun, and whether &quot;Mr. Brightside&quot; is still on your playlist.

The details
Where: ROGER at The Ameswell Hotel, 800 Moffett Blvd, Mountain View
When: Thursday, November 19, 6–8pm
Wear: Smart casual. Dress like you might run into your high school crush.

Put the apps down for one night, RSVP, and bring a friend. Message received? Roger that. See you on the 19th." data-next-head=""/>
